<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lyra</title>
<meta name="description" content="Lyra – obiteljska aplikacija zvjezdica (demo s izmišljenom obitelji)">
<meta name="theme-color" content="#0b1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lyra">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Luckiest+Guy&family=Lilita+One&family=Bungee&display=swap">
<style>
/* Layout: ploča sa sjajem (tema Režija) — gore tabovi Pregled/Toni/Ema/Mališa, na listu djeteta tanka traka stanja iznad popisa, popis grupiran po mjesecima */
:root{
  color-scheme:dark;
  --bg:#0b131c; --bg-2:#0d1621; --surface:#111c28; --surface-2:#172433; --line:#22354a; --fg:#e2eaf2; --muted:#93a7bb; --dim:#6f8399;
  --accent:#8fc0ee; --accent-soft:#1a2d42; --glow-b:rgba(122,178,236,.42);
  --gold:#f2c968; --gold-2:#e8a94e; --gold-soft:rgba(242,201,104,.12); --gold-line:rgba(242,201,104,.45);
  --ok:#80d0b0; --ok-soft:#14302b; --warn:#dfc080; --warn-soft:#33301f; --bad:#f09a80; --bad-soft:#3d2421; --chk:#f0b98e; --chk-soft:#3a2a1c; --none:#4b5d70;
  --k-toni:#8fb4ee; --k-ema:#e9a3c3; --k-malisa:#86d1b7;
  --glass:linear-gradient(180deg, rgba(36,60,88,.5), rgba(13,22,34,.92));
  --shadow:0 0 18px rgba(70,140,220,.14), inset 0 1px 0 rgba(255,255,255,.05);
  --f-display:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1100px 520px at 50% 0%, #182a40 0%, var(--bg-2) 55%, #0a1118 100%) fixed, var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto}
@media (min-width:1300px){
  .wrap{max-width:min(1540px,calc(100vw - 80px))}
  .kidtop .ava{--s:170px}
  .kidtop h2{font-size:27px}
  .kid.home{padding:26px 20px 22px;gap:16px}
     
  .boardnote{font-size:19.5px}
  .afr::before{inset:-12px}.afr::after{inset:-19px}
  .afr .horn{top:-50px;width:24px;height:46px}.afr .pxcrown{top:-44px;width:52px;height:31px}.afr .trophy{top:-48px;font-size:34px}
  .kdeco .dk{transform:scale(1.15)}
}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:#0c1520;border:1px solid rgba(122,178,236,.25);border-radius:9px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* zvjezdica */
.st{display:inline-block;width:1em;height:1em;vertical-align:-.12em;flex:none}
.st{overflow:visible}
.st.m{width:.72em;height:.72em;vertical-align:-.03em}
.st .eye{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .st.blink .eye{animation:blink 4.6s infinite}
  .st.blink .face{transform-box:fill-box;transform-origin:center;animation:look 7s ease-in-out infinite}
  @keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
  @keyframes look{0%,40%,100%{transform:translateX(0)}50%,60%{transform:translateX(2.5px)}70%,80%{transform:translateX(-2px)}}
}

/* zaglavlje */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding-block:24px 6px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .mark{width:46px;height:46px;border-radius:14px;border:1px solid var(--gold-line);background:radial-gradient(circle at 50% 40%, #2a3a4c, #141e2a);display:grid;place-items:center;font-size:24px;box-shadow:0 0 16px rgba(242,201,104,.14)}
.brand h1{font-size:26px;font-weight:600;letter-spacing:-.01em}
.brand .sub{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(14,24,37,.85);border:1px solid rgba(122,178,236,.22);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;color:#9fb1c4;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.tabs button .dot{width:8px;height:8px;border-radius:50%;background:var(--kc,var(--muted))}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,rgba(58,94,134,.75),rgba(28,50,76,.95));color:#fff;box-shadow:0 0 0 1px rgba(122,178,236,.5),0 0 14px rgba(70,140,220,.25)}
.tabs .badge{font-size:11px;font-weight:700;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 6px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(122,178,236,.4);background:rgba(18,30,46,.7);color:#b6c6d7;font-weight:700;display:inline-grid;place-items:center;flex:none}
.iconbtn[aria-expanded="true"]{background:#e2eaf2;color:#0f1a26}
.helpwrap{position:relative}
.helppop{position:absolute;right:0;top:44px;z-index:15;width:min(380px,calc(100vw - 32px));background:#121e2b;border:1px solid var(--glow-b);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:12px 16px;font-size:13px;color:#a9bacb}
.helppop h3{font-size:14px;color:var(--fg);margin:8px 0 4px}
.helppop p{margin:4px 0}

/* gumbi, čipovi, pilule */
.btn{border:1px solid rgba(122,178,236,.3);background:rgba(18,30,46,.7);color:#cbd8e5;border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:rgba(122,178,236,.55)}
.btn.pri{background:linear-gradient(180deg,#3a6896,#24476c);color:#fff;border-color:rgba(122,178,236,.6)}
.btn.gold{background:var(--gold-soft);border-color:var(--gold-line);color:#f6dfa6}
.btn.gold:hover{box-shadow:0 0 14px rgba(242,201,104,.2)}
.btn.danger{color:var(--bad);border-color:rgba(240,154,128,.4)}
.btn.sm{padding:5px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid rgba(122,178,236,.26);background:rgba(18,30,46,.7);color:#b6c6d7;border-radius:999px;padding:6px 13px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--gold-line);color:#f6dfa6;background:var(--gold-soft)}
.chip .c{font-family:var(--f-mono);font-size:11.5px;opacity:.8;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.adv{background:var(--warn-soft);color:var(--warn)}
.pill.owe{background:var(--bad-soft);color:var(--bad)} .pill.chk{background:var(--chk-soft);color:var(--chk)} .pill.unk{background:var(--surface-2);color:var(--muted)}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--muted)}
.tag.skola{border-color:rgba(143,192,238,.4);color:var(--accent)}
.tag.ostalo{border-color:rgba(134,209,183,.4);color:#86d1b7}

/* panel */
.panel{background:var(--glass);border:1px solid rgba(122,178,236,.26);border-radius:var(--r);box-shadow:var(--shadow)}

/* PREGLED */
.kids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
@media (max-width:900px){.kids{grid-template-columns:minmax(0,1fr)}}
.kid{padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-top:3px solid color-mix(in srgb,var(--kc) 70%,transparent);text-align:left;width:100%}
.kid:hover{border-color:color-mix(in srgb,var(--kc) 60%,transparent)}
.kid-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kid-h h2{font-size:21px;font-weight:600;color:var(--kc)}
.kid-h .eur{font-family:var(--f-display);font-size:22px;font-weight:600}
.kid .big{display:flex;gap:18px;align-items:flex-end}
.kid .big div{display:flex;flex-direction:column}
.kid .big b{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;display:flex;align-items:center;gap:6px}
.kid .big b .st{font-size:22px}
.kid .big span{font-size:12px;color:var(--muted)}
.sky{display:flex;flex-wrap:wrap;gap:3px;min-height:16px;font-size:13px}
.sky .more{font-size:11.5px;color:var(--muted);align-self:center;margin-left:4px}
.kid .flags{display:flex;gap:6px;flex-wrap:wrap}
.kid .note{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.box{padding:14px 16px}
.box h2{font-size:17px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.box h2 .c{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}

/* redovi (popis) */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px 64px minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 4px;border:0;border-top:1px solid rgba(122,178,236,.12);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:rgba(122,178,236,.05)}
.row .sym{font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%}
.row .sym .vm{font:600 9px var(--f-body);letter-spacing:.06em;text-transform:uppercase;font-style:normal;line-height:1;color:var(--muted);opacity:.8}
.row .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.row .t{min-width:0}
.row .t b{font-weight:600}
.row .t span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who{font-size:12px;font-weight:600;color:var(--kc)}
.row.wk{border-top:0;margin:5px 0;padding:10px 10px 10px 8px;border-left:5px solid var(--kc);border-radius:12px;background:color-mix(in srgb,var(--kc) 13%,transparent)}
.row.wk:hover{background:color-mix(in srgb,var(--kc) 22%,transparent)}
.row.wk{grid-template-columns:40px minmax(0,1fr) auto;gap:6px 10px}
.row.wk .sym{grid-column:1;grid-row:1/3;font-size:24px}
.row.wk .t{grid-column:2;grid-row:1}
.row.wk .eur{grid-column:3;grid-row:1;align-self:start;margin-top:4px}
.row.wk .pillc{grid-column:2;grid-row:2;justify-content:flex-start}
.row.wk .d{grid-column:3;grid-row:2;text-align:right}
.row .t .who{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;color:var(--kc);margin-bottom:3px;overflow:visible;white-space:nowrap}
.row .t .who .ava{--s:24px;display:grid;box-shadow:0 0 0 2px var(--kc)}
.row .t .who .ava .ini{display:block;font-size:11px;color:#0b131c}
.row .t .tag{display:inline-block;margin-left:6px;vertical-align:1px}
.row .t b + .tag{margin-left:6px}
.row .eur{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);min-width:34px;text-align:right}
@media (max-width:600px){
  .row{grid-template-columns:38px minmax(0,1fr) auto}
  .row .d{grid-column:2;grid-row:2;order:3}
  .row .t{grid-column:2;grid-row:1}
  .row .pillc{grid-column:3;grid-row:1}
  .row .eur{grid-column:3;grid-row:2}
}
.month{font-family:var(--f-display);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:14px 4px 4px;display:flex;justify-content:space-between}
.month .ms{font-family:var(--f-body);text-transform:none;letter-spacing:0;display:flex;gap:4px;align-items:center}

/* DIJETE */
.kidbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 16px;margin:18px 0 12px;border-left:3px solid color-mix(in srgb,var(--kc) 70%,transparent)}
.kidbar h2{font-size:20px;font-weight:600;color:var(--kc);margin-right:4px}
.kidbar .kv{display:flex;flex-direction:column;line-height:1.2}
.kidbar .kv b{font-family:var(--f-display);font-size:19px;font-weight:600;display:flex;align-items:center;gap:5px}
.kidbar .kv span{font-size:11.5px;color:var(--muted)}
.kidbar .flags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.listbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.list{padding:4px 14px 10px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.notice{font-size:13px;color:var(--muted);padding:10px 14px;border:1px dashed rgba(122,178,236,.3);border-radius:10px;margin-bottom:12px}

/* PROVJERE */
.tblwrap{overflow-x:auto}
table.pv{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.pv th,table.pv td{padding:9px 10px;border-bottom:1px solid rgba(122,178,236,.12);text-align:left;vertical-align:top}
table.pv th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}

/* ladica */
.scrim{position:fixed;inset:0;background:rgba(4,8,14,.6);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:#0f1925;border-left:1px solid var(--glow-b);box-shadow:-10px 0 40px rgba(0,0,0,.45);z-index:21;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:19px}
.drawer .body{overflow-y:auto;padding:14px 18px 22px;display:flex;flex-direction:column;gap:12px}
.drawer footer{display:flex;gap:8px;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer footer .r{display:flex;gap:8px;flex-wrap:wrap}
.x{border:0;background:#1a2736;color:#cbd8e5;border-radius:9px;width:34px;height:34px;font-size:18px;flex:none}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f .lb{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.f2{grid-template-columns:1fr}}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid rgba(122,178,236,.26);background:rgba(18,30,46,.7);color:#b6c6d7;border-radius:9px;padding:7px 12px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{border-color:var(--gold-line);background:var(--gold-soft);color:#f6dfa6}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;border:1px solid rgba(122,178,236,.2);border-radius:10px;background:rgba(18,30,46,.45)}
.stline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#e9eff5;color:#0f1a26;padding:9px 16px;border-radius:999px;z-index:40;font-size:14px}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}
  .row:hover .sym .st:not(.q){animation:tw .9s ease-in-out}
  @keyframes tw{50%{transform:scale(1.18) rotate(8deg);filter:drop-shadow(0 0 4px rgba(242,201,104,.55))}}
}

/* ===== ploča, boje, početna ===== */
.badge.g{background:var(--gold-soft);color:var(--gold)}
.kids.home{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.kids.home{grid-template-columns:minmax(0,1fr)}}
.kid.home{align-items:center;text-align:center;gap:14px;padding:20px 16px}
.kidtop{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--fg);padding:0}
.kidtop .ava{--s:clamp(96px,26vw,128px);transition:transform .2s}
.kidtop:hover .ava{transform:scale(1.04)}
.kidtop h2{font-size:22px;font-weight:600;color:var(--kc)}
.panel h2 .hint{font:400 12px var(--f-body);color:var(--muted);margin-left:6px}
.boardnote .bn-sub{font-size:11.5px;color:var(--muted);flex-basis:100%;text-align:center;margin-top:-4px}
.boardnote[style*="flex-start"] .bn-sub{text-align:left}
.pend{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:12px 10px;border-radius:14px;background:rgba(223,192,128,.08);border:1px dashed rgba(223,192,128,.35)}
.pend .lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--warn)}
.pend .stars{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:30px;line-height:1}
.pst{border:0;background:none;padding:2px;line-height:0;border-radius:10px;cursor:pointer}
.pst .st{transition:transform .15s}.pst:hover .st,.pst:focus-visible .st{transform:scale(1.18) rotate(-8deg)}
.pend .txt{font-size:13px;color:#ead7b0}
.allok{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ok);padding:8px 0}
.boardnote{font-size:17.5px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
.boardnote b{color:var(--fg)}
.coin{--cs:2.7em;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.04em;min-width:var(--cs);height:var(--cs);padding:0 .34em;border-radius:999px;vertical-align:middle;isolation:isolate;
  --o1:#fff0a8;--o2:#f6c840;--o3:#e2a118;--o4:#c8870c;--i1:#ffe476;--i2:#f7c23a;--i3:#eab02a;--e1:#a5700a;--e2:#8a5c06;--tx:#6b3f00;--tx2:#7a4e00;--glow:0 0 0 transparent;
  background:linear-gradient(150deg,var(--o1) 0%,var(--o2) 30%,var(--o3) 70%,var(--o4) 100%);
  box-shadow:0 .14em 0 var(--e1),0 .16em 0 var(--e2),0 .3em .45em rgba(0,0,0,.35),var(--glow);
  color:var(--tx);font-family:var(--f-display);line-height:1;margin:0 .12em .14em}
.coin::before{content:"";position:absolute;inset:.17em;border-radius:999px;z-index:-1;
  background:linear-gradient(150deg,var(--i1) 0%,var(--i2) 45%,var(--i3) 100%);
  box-shadow:inset 0 .06em .08em rgba(140,90,0,.45),inset 0 -.04em .05em rgba(255,250,210,.7);
  outline:1px dashed rgba(150,100,10,.45);outline-offset:-.16em}
.coin::after{content:"";position:absolute;inset:0;border-radius:999px;z-index:-1;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 42%,transparent 52%)}

const STAR_PATH = (() => {
  const cx=50, cy=54, R=49, r=31, pts=[];
  for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rr=i%2?r:R; pts.push([cx+Math.cos(ang)*rr, cy+Math.sin(ang)*rr, i%2===0]); }

  const minus = /(^|\s)minus(\s|$)/.test(cls) ? '<g class="mn"><circle cx="83" cy="17" r="15" fill="#e5484d" stroke="#fff" stroke-width="3"/><path d="M75 17H91" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>' : '';
  return `<svg class="st ${cls}" viewBox="0 0 100 100" aria-hidden="true"><path class="body" d="${STAR_PATH}" fill="${c[0]}" stroke="${c[1]}" stroke-width="2.5" stroke-linejoin="round"/><g class="face" fill="${ink}" stroke="${ink}" stroke-width="0">${FACES[face]||FACES.smile}</g>${minus}</svg>`; };
// razredi: do 5 € · 5–10 · 10–20 · 20–30 · 30–50 · 50–80 · 80 i više
const coinTier = v => { const a=Math.abs(v); return a<5?1 : a<10?2 : a<20?3 : a<30?4 : a<50?5 : a<80?6 : 7; };
const coin = n => { const v=Math.round(Number(n)||0), t=coinTier(v);
  const fx = (t===7?'<span class="halo" aria-hidden="true"></span><span class="cr" aria-hidden="true">👑</span>':'') + (t>=5?'<span class="sp s1" aria-hidden="true"></span><span class="sp s2" aria-hidden="true"></span>':'') + (t>=6?'<span class="sp s3" aria-hidden="true"></span>':'');
  return `<span class="coin t${t}${String(Math.abs(v)).length>2?' w':''}" title="${v} €" aria-label="${v} eura">${fx}<b>${v}</b><i>€</i></span>`; };

/* ---------- logika ---------- */
function status(z){
  if(isK(z) || isKup(z)) return 'oka';
  if(z.rjesenje==='nedajemo' && z.dano!=='DA') return 'skip';
  if(z.zvjezdica==='?' || !z.dano || z.dano==='?') return 'unk';
  if(z.kategorija==='ostalo') return z.dano==='DA' ? 'oka' : 'owe';
  if(z.dano==='DA') return z.eDnevnik==='DA' ? 'ok' : (days(z.datum)>14 ? 'chk' : 'adv');
  return z.eDnevnik==='DA' ? 'owe' : 'unk';
}
const vrijednost = z => isKup(z) ? -kupIznos(z) : (z.zvjezdica==='V' ? S.post.vrijednostV : z.zvjezdica==='M' ? S.post.vrijednostM : 0) * (Number(z.broj)||1) * (isK(z)?-1:1);
const ofKid = id => [...S.z.values()].filter(z=>z.dijete===id).sort((a,b)=>(b.datum||'').localeCompare(a.datum||'') || (b.kreirano||'').localeCompare(a.kreirano||''));
const isPend = z => z.dano==='DA' && z.naPloci==='NE';
function stats(list){
  const r={V:0,M:0,eur:0,ok:0,oka:0,adv:0,owe:0,chk:0,unk:0,skip:0, given:[], pend:[], pendV:0, pendM:0, pendKV:0, pendKM:0};
  for(const z of list){
    const s=status(z); r[s]++; const kz=isK(z);
    if(isKup(z)){ if(z.dano==='DA'){ r.V-=kupV(z); r.M-=kupM(z); r.eur+=vrijednost(z); } if(isPend(z)){ r.pend.push(z); r.pendKV+=kupV(z); r.pendKM+=kupM(z); } continue; }
    if(isPend(z)){ r.pend.push(z); const n=Number(z.broj)||1; if(kz){ if(z.zvjezdica==='M') r.pendKM+=n; else r.pendKV+=n; } else if(z.zvjezdica==='M') r.pendM+=n; else r.pendV+=n; }
    if(z.dano==='DA'){ const n=(Number(z.broj)||1)*(kz?-1:1); if(z.zvjezdica==='V'){r.V+=n;} if(z.zvjezdica==='M'){r.M+=n;} r.eur+=vrijednost(z); if(!kz) for(let i=0;i<n;i++) r.given.push(z.zvjezdica); }
  }
  return r;
}
const flags = r => [['owe',r.owe],['chk',r.chk],['adv',r.adv],['unk',r.unk]].filter(([,n])=>n).map(([k,n])=>`<span class="pill ${ST[k].c}">${EDT[k]} · ${n}</span>`).join('') || `<span class="pill ok">e-Dnevnik u redu</span>`;
const EDT = {ok:'e-Dnevnik ✓', oka:'Dano', adv:'čeka e-Dnevnik', chk:'nema u e-Dnevniku', owe:'petica bez zvjezdice', unk:'nejasno', skip:'bez zvjezdice'};
const lastPloca = () => S.ploca[0] || null;

const boardNow = kid => { const p=lastPloca(); const st=p&&p.stanje&&p.stanje[kid]; if(!st) return null;
  const since=p.kreirano||(p.datum+'T23:59:59'); const add=ofKid(kid).filter(z=>z.naPloci==='DA' && z.dano==='DA' && z.plocaTs && z.plocaTs>since);

  return {V:(st.V??0)+aV, M:(st.M??0)+aM, aV, aM, datum:p.datum}; };

  S.dbRaw.collection('koraci').onSnapshot(q=>{ S.kor=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||'').localeCompare(a.ts||'')); if(S.setOpen) renderPostavke(); }, ()=>{});

  const dur=1300, t0=performance.now(); const tick=now=>{ const t=Math.min(1,(now-t0)/dur); const rr=R*bell(t)*1.0+R*0.0, out=s5(t/.25)*(1-s5(seg(t,.75,1)));

    if(t<1) requestAnimationFrame(tick); else ps.forEach(d=>d.remove()); };
  requestAnimationFrame(tick); }
// oblačić s porukom (pop sa squash&stretch, drži, odleti)
function rxBubble(el, text){ if(RM()){ toast(text); return; } const b=el.getBoundingClientRect(); const d=document.createElement('div'); d.className='rxbub'; d.textContent=text; document.body.appendChild(d);
  const w=d.offsetWidth, h=d.offsetHeight, x=b.left+b.width/2-w/2, y=b.top-h-12, dur=2300, t0=performance.now();
  const tick=now=>{ const t=Math.min(1,(now-t0)/dur); let sy=1, yy=0, op=1;

// „kuhanje“ linije: kontura zvjezdice se blago pomiče ~10× u sekundi (po zidnom satu, hash po id-u oblika)
const BOIL_CACHE={};

  const cx=50, cy=54, pts=[]; for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rr=(i%2?31:49)+(hsh(seed*13+i)-.5)*2.4, aj=ang+(hsh(seed*7+i)-.5)*.035; pts.push([cx+Math.cos(aj)*rr, cy+Math.sin(aj)*rr, i%2===0]); }
  const P=(a,b,f)=>[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f], n=v=>v.toFixed(2); let d='';
  for(let i=0;i<10;i++){ const p0=pts[(i+9)%10], p1=pts[i], p2=pts[(i+1)%10], f=p1[2]?0.42:0.24; const a=P(p1,p0,f), b=P(p1,p2,f); d+=(i===0?`M${n(a[0])} ${n(a[1])}`:`L${n(a[0])} ${n(a[1])}`)+`Q${n(p1[0])} ${n(p1[1])} ${n(b[0])} ${n(b[1])}`; }
  return BOIL_CACHE[seed]=d+'Z'; }
function rxBoil(svg, ms, id=1){ const body=svg&&svg.querySelector('.body'); if(!body||RM()) return; if(!RX_ORIG.has(body)) RX_ORIG.set(body, body.getAttribute('d')); const orig=RX_ORIG.get(body); const t0=performance.now(); body._bt=t0;
  const tick=now=>{ if(!body.isConnected) return; const k=Math.floor(now/100); body.setAttribute('d', boilPath((k%6)+id*6)); if(body._bt!==t0) return; if(now-t0<ms) requestAnimationFrame(tick); else { body.setAttribute('d',orig); RX_ORIG.delete(body); } };
  requestAnimationFrame(tick); }

const sPos = x => ({getBoundingClientRect:()=>({left:x,width:0})}); // lijevo/desno prema mjestu na ekranu

const SBUF={}, SCNT={}; let SLOAD=null;
function smpMeta(b){ const d=b.getChannelData(0), sr=b.sampleRate; let pk=0; for(let i=0;i<d.length;i++){ const a=Math.abs(d[i]); if(a>pk) pk=a; }

  const ac=SND.ac, now=ac.currentTime, rise=SRISE.has(name); let st=rise?when:when-m.anchor, off=rise?m.first:0; if(st<now){ off+=now-st; st=now; }

function sndAt(name, perfMs, vol=1, el){ const ac=sndCtx(); if(!ac||!SFX[name]) return; const dt=Math.max(0,(perfMs-performance.now())/1000);

  const when=ac.currentTime+dt+.005; try{ const f=smpPlay(name,when,vol,pan); if(f){ sndTag(name, typeof f==='string'?f+'.mp3':'snimka', dt, vol); return; } SFX[name](when, vol, pan); sndTag(name,'sinteza', dt, vol); }catch(e){} }
// ▶ u oznaci zvuka: ponovi točno taj zvuk (ista snimka ili ista sinteza, ista glasnoća)
function sndReplay(id){ const e=STAG.find(x=>x.id===id); if(!e) return false; const ac=sndCtx(); if(!ac){ toast('Zvuk je isključen (🔊 gore desno)'); return false; } const when=ac.currentTime+.02;
  try{ if(e.file!==null && smpPlay(e.raw, when, e.vol, 0, e.file||undefined)) return true; if(SFX[e.raw]){ SFX[e.raw](when, e.vol, 0); return true; } }catch(x){} return false; }
// diskretna oznaka zvuka u gornjem lijevom kutu (+ kopiraj ime) – da se lako kaže koji zvuk maknuti
const STAG=[];
function sndTag(name, src, dt, vol=1){ if(!S.dev) return; setTimeout(()=>{ const raw=name; if(/^note\d+$/.test(name)) { name='nota'; } const id=`${name} · ${src}`; const i=STAG.findIndex(x=>x.id===id); if(i>=0) STAG.splice(i,1); STAG.unshift({id, raw, vol, file: /\.mp3$/.test(src)?src.slice(0,-4) : src==='snimka'?'':null}); STAG.length=Math.min(STAG.length,3);
  let box=document.getElementById('sndtag'); if(!box){ box=document.createElement('div'); box.id='sndtag'; box.setAttribute('aria-live','off'); document.body.appendChild(box);
    box.addEventListener('click', ev=>{ const pl=ev.target.closest('[data-snplay]'); if(pl){ ev.stopPropagation(); if(sndReplay(pl.dataset.snplay)){ pl.textContent='🔊'; clearTimeout(pl._t); pl._t=setTimeout(()=>{ if(pl.isConnected) pl.textContent='▶'; },700); } return; }
      const b=ev.target.closest('[data-sncopy]'); if(!b) return; ev.stopPropagation(); const txt=b.dataset.sncopy; const done=()=>{ b.textContent='✓'; setTimeout(()=>{ if(b.isConnected) b.textContent='📋'; },1200); };

  if(!d.png){ st.off.width=d.w||1; st.off.height=d.h||1; st.off.getContext('2d').clearRect(0,0,st.off.width,st.off.height); return done(); }
  CH_PEND++; const img=new Image(); img.onerror=()=>{ CH_PEND--; chReady(); }; img.onload=()=>{ CH_PEND--; setTimeout(chReady,0); st.off.width=d.w||img.width; st.off.height=d.h||img.height; const oc=st.off.getContext('2d'); oc.clearRect(0,0,st.off.width,st.off.height); oc.drawImage(img,0,0,st.off.width,st.off.height); done(); }; img.src=d.png; }

  if(fk){ const n=document.querySelector(`[data-ljime="${fk}"]`); if(n){ n.focus({preventScroll:true}); } } }
const ljSkriveni = () => Array.isArray((S.ljub||{}).skriveni) ? S.ljub.skriveni.filter(id=>PET_CAT[id]) : [];
async function ljHide(id, hide){ const cur={...(S.ljub||{})}, set=new Set(ljSkriveni()); if(hide) set.add(id); else set.delete(id); cur.skriveni=[...set]; S.ljub=cur; S.ljConf=null; render();
  try{ await S.realDb.collection('postavke').doc('ljubimci').set(jclone(cur)); toast(hide?`${PET_CAT[id].ime} maknut iz ponude (🗄️ dolje ga možeš vratiti)`:`${PET_CAT[id].ime} vraćen u ponudu`); }catch(e){ toast('Nije spremljeno – pokušaj ponovno'); } }

/* ===================== UREDI RASPORED: povlačenje skupina elemenata na karticama (po verziji, za sve tri kartice) ===================== */
const LAY_G=[['slika','Slika s imenom','.kidtop'],['medalja','Medalja s brojem','.rank .med'],['natpis','Naziv razine','.rank .tt'],['ploca','Zvjezdice s novčićem','.boardnote'],['jos','Koliko još treba','.redge'],['ljubimac','Ljubimac','.petbtn']];
let LAYD=null;
const LAY_RANK=['medalja','natpis'];
function layGet(){ const L={...(((S.laydoc||{})[curRankId()])||{})}; if(L.razina){ LAY_RANK.forEach(g=>{ if(!L[g]) L[g]=L.razina; }); delete L.razina; } return L; }
// položaj skupine = njezino SREDIŠTE (x od sredine kartice, y od vrha) – isto na svim karticama, bez obzira na širinu natpisa ili veličinu medalje
function layTr(el){ const m=(el.style.translate||'').match(/-?[\d.]+/g)||[]; return {x:+m[0]||0, y:+m[1]||0}; }
function layNat(el,card){ if(el.classList.contains('redge')) return {cx:0, cy:0}; let x=0,y=0,e=el; while(e && e!==card){ x+=e.offsetLeft; y+=e.offsetTop; e=e.offsetParent; }
  if(e!==card){ const r=el.getBoundingClientRect(), c=card.getBoundingClientRect(), t=layTr(el); return {cx:r.left+r.width/2-t.x-(c.left+c.width/2), cy:r.top+r.height/2-t.y-c.top}; }
  return {cx:x+el.offsetWidth/2-card.clientWidth/2, cy:y+el.offsetHeight/2}; }
function layEls(card,g,sel){ return [...card.querySelectorAll(sel)].filter(el=>el.closest('.kid.home')===card && (LAY_RANK.includes(g) || el.classList.contains('rank') || !el.closest('.rank'))); }
function layTarget(g,L,cards){ const o=LAYD&&LAYD.g===g&&LAYD.t?LAYD.t:L[g]; if(!o) return null; if(o.cx!=null) return o;
  const sel=LAY_G.find(x=>x[0]===g)[2]; // staro spremanje (pomak) → središte kao na prvoj (Tonijevoj) kartici
  for(const card of cards){ const el=layEls(card,g,sel).find(x=>x.offsetWidth); if(el){ const n=layNat(el,card); return {cx:n.cx+(o.x||0), cy:n.cy+(o.y||0)}; } } return null; }
// raspored je spremljen za širinu kartice _w (stari zapisi: 470 px); na užoj/široj kartici vodoravni položaj se razmjerno skalira i ostaje unutar kartice
function layApply(){ const L=layGet(), cards=[...document.querySelectorAll('.kid.home')], refW=L._w||470;
  LAY_G.forEach(([g,nm,sel])=>{ const T=layTarget(g,L,cards), live=LAYD && LAYD.g===g && LAYD.t;
    cards.forEach(card=>layEls(card,g,sel).forEach(el=>{ el.dataset.lg=g; el.dataset.lgname=nm; if(!T || !el.offsetWidth){ el.style.translate=''; return; }
      let tx=T.cx, ty=T.cy;
      if(!el.classList.contains('redge')){ const W=card.clientWidth, H=card.clientHeight, hw=el.offsetWidth/2; if(!live) tx=T.cx*W/refW; tx=Math.max(-W/2+hw+2, Math.min(W/2-hw-2, tx)); ty=Math.max(0, Math.min(H, ty)); }
      const n=layNat(el,card), dx=Math.round(tx-n.cx), dy=Math.round(ty-n.cy); el.style.translate = dx||dy ? `${dx}px ${dy}px` : ''; })); }); }
function layGuideH(y){ document.querySelectorAll('.kid.home').forEach(card=>{ let gd=card.querySelector(':scope>.layguideh'); if(y==null){ if(gd) gd.remove(); return; }
  if(!gd){ gd=document.createElement('i'); gd.className='layguideh'; card.appendChild(gd); } gd.style.top=y+'px'; }); }
function layGuide(x){ document.querySelectorAll('.kid.home').forEach(card=>{ let gd=card.querySelector(':scope>.layguide'); if(x==null){ if(gd) gd.remove(); return; }
  if(!gd){ gd=document.createElement('i'); gd.className='layguide'; card.appendChild(gd); } gd.style.left=`calc(50% + ${x}px)`; }); }
function layToggle(){ S.layEdit=!S.layEdit; document.body.classList.toggle('editlay', !!S.layEdit); if(S.layEdit && S.view!=='pregled') go('pregled'); renderPR(); layApply(); toast(S.layEdit?'✥ Uređivanje rasporeda – povuci elemente na karticama':'Raspored spremljen'); }
async function layReset(){ const ver=curRankId(), doc=jclone(S.laydoc||{}); delete doc[ver]; S.laydoc=doc; layApply(); try{ await S.realDb.collection('postavke').doc('raspored-kartica').set(doc); toast('Zadani raspored vraćen ('+ver+')'); }catch(e){ toast('Nije spremljeno'); } }
document.addEventListener('pointerdown', e=>{ if(!S.layEdit || e.button!==0) return; const el=e.target.closest && e.target.closest('.kid.home [data-lg]'); if(!el) return; e.preventDefault(); e.stopPropagation();
  const g=el.dataset.lg, card=el.closest('.kid.home'), n=layNat(el,card), tr=layTr(el); LAYD={g, card, pid:e.pointerId, sx:e.clientX, sy:e.clientY, t0:{cx:n.cx+tr.x, cy:n.cy+tr.y}, t:null}; document.body.classList.add('laydrag'); document.querySelectorAll(`.kid.home [data-lg="${g}"]`).forEach(x=>x.classList.add('layon')); }, true);
addEventListener('pointermove', e=>{ if(!LAYD || e.pointerId!==LAYD.pid) return; let cx=LAYD.t0.cx+e.clientX-LAYD.sx, cy=LAYD.t0.cy+e.clientY-LAYD.sy, snap=null;
  if(LAYD.g==='jos'){ // stup: vrh se „zalijepi“ na vrh medalje (žuta vodoravna crta)
    const rg=LAYD.card.querySelector('.redge'), col=rg&&rg.querySelector('.col'), med=LAYD.card.querySelector('.rank .med'); let sy=null;
    if(col && med && med.offsetWidth){ const cr=LAYD.card.getBoundingClientRect(), top=col.getBoundingClientRect().top-layTr(rg).y+cy, mt=med.getBoundingClientRect().top; if(Math.abs(top-mt)<=10){ cy+=mt-top; sy=mt-cr.top; } }
    LAYD.t={cx:Math.round(cx), cy:Math.round(cy)}; layGuide(null); layGuideH(sy); layApply(); return; }
  const cands=[0]; if(LAYD.g!=='slika'){ const k=LAYD.card.querySelector('[data-lg="slika"]'); if(k && k.offsetWidth){ const n=layNat(k,LAYD.card), t=layTr(k); cands.unshift(n.cx+t.x); } } // sredina slike, pa sredina kartice
  for(const c of cands) if(Math.abs(cx-c)<=10){ cx=c; snap=c; break; }
  LAYD.t={cx:Math.round(cx), cy:Math.round(cy)}; layGuide(snap); layApply(); });
async function layUp(e){ if(!LAYD || e.pointerId!==LAYD.pid) return; const d=LAYD; LAYD=null; layGuide(null); layGuideH(null); document.body.classList.remove('laydrag'); document.querySelectorAll('.layon').forEach(x=>x.classList.remove('layon')); if(!d.t) return;
  const ver=curRankId(), doc=jclone(S.laydoc||{}), old=layGet(), ref=old._w||470, Wn=(d.card&&d.card.clientWidth)||ref, nd={};
  for(const [g,v] of Object.entries(old)){ if(g==='_w' || !v) continue; nd[g] = (v.cx!=null && g!=='jos') ? {cx:Math.round(v.cx*Wn/ref), cy:v.cy} : v; }   // ostale skupine preračunaj na sadašnju širinu
  nd[d.g]=d.t; nd._w=Wn; doc[ver]=nd; S.laydoc=doc; layApply();
  try{ await S.realDb.collection('postavke').doc('raspored-kartica').set(doc); }catch(err){ toast('Raspored nije spremljen – pokušaj ponovno'); } }
addEventListener('pointerup', layUp); addEventListener('pointercancel', layUp);
document.addEventListener('click', e=>{ if(S.layEdit && e.target.closest && e.target.closest('.kid.home')){ e.preventDefault(); e.stopPropagation(); } }, true);
['pointerover','pointerenter'].forEach(t=>document.addEventListener(t, e=>{ if(S.layEdit && e.target.closest && e.target.closest('.kid.home')) e.stopPropagation(); }, true));

/* --- redoslijed animacija: „vreća“ – svaka se vidi jednom dok se ne potroše sve, pa ispočetka nasumično --- */
function nextAnim(n){ let B0=S.animBag||{}; try{ if(!B0.ostale){ const ls=JSON.parse(localStorage.getItem('zv-animbag')||'null'); if(ls) B0=ls; } }catch(e){}
  let ost=(Array.isArray(B0.ostale)&&B0.n===n) ? B0.ostale.filter(i=>i>=0&&i<n) : [];
  if(!ost.length){ ost=[...Array(n).keys()]; if(n>1 && B0.zadnja!=null) ost=ost.filter(i=>i!==B0.zadnja); }
  const pick=ost[Math.floor(Math.random()*ost.length)];
  const nb={ostale:ost.filter(i=>i!==pick), zadnja:pick, n, ts:new Date().toISOString()}; S.animBag=nb;
  try{ localStorage.setItem('zv-animbag', JSON.stringify(nb)); }catch(e){}
  try{ S.dbRaw && S.dbRaw.collection('postavke').doc('animacije').set(nb); }catch(e){}
  return pick; }

/* A) Odbijanje od zidova: zvjezdica poleti, lupi lijevo-desno-gore i sleti djetetu */
async function flyBounce(a,b,big){

  frames.push({x:a.x,y:a.y,offset:0,sx:1,sy:1,r:0});
  for(let i=0;i<4;i++){
    const p=pts[i], q=pts[i+1], o2=off+seg[i];
    const mid=lerp(p,q,.5); frames.push({x:mid.x,y:mid.y-(i===3?60:18),offset:off+seg[i]/2,sx:1,sy:1,r:(i+.5)*200});
    if(q.w){ const sq = q.w==='T' ? {sx:1.35,sy:.6} : {sx:.6,sy:1.35};

  const tr=trailOn(frames,dur,5,24,90); sndAt('whoosh',performance.now(),.6,sPos(a.x));
  let acc=0; seg.slice(0,3).forEach((sg,i)=>{ acc+=sg; const q=pts[i+1]; const when=acc*dur;
    setTimeout(()=>{ sndAt('boing',performance.now(),.75,sPos(q.x)); flyFace(f,big,'oh'); setTimeout(()=>flyFace(f,big,i===2?'happy':'wink'),260); const dir = q.w==='R'?Math.PI : q.w==='L'?0 : Math.PI/2; burst(q.x,q.y,7,26,30,dir,1.6); ringAt(q.x,q.y,70,380); shake(q.w==='R'?6:q.w==='L'?-6:0); },when); });

  const w=$('#sh-what'), c=$('#sh-cij'), hh=$('#sh-laph'), row=$('#sh-lap'), chip=document.querySelector('[data-shlap]');
  if(w) w.value=`Vrijeme na laptopu – ${h} h`; if(c) c.value=need*vM; if(hh) hh.textContent=h; if(row) row.hidden=false; if(chip) chip.setAttribute('aria-pressed','true');
  shopUpd(); }
function lapOff(){ if(!SH) return; SH.lapH=null; const row=$('#sh-lap'), chip=document.querySelector('[data-shlap]'); if(row) row.hidden=true; if(chip) chip.setAttribute('aria-pressed','false'); }

function shopStep(st){ if(!SH) return; const f=st[0], d=Number(st.slice(1)); const key='k'+f, mx=f==='V'?SH.maxV:SH.maxM; SH[key]=Math.min(mx, Math.max(0, SH[key]+d)); if(d>0 && SH[key]===mx && (f==='V'?SH.maxV:SH.maxM)===SH[key]) {} shopUpd(); }

  const pick=ost[Math.floor(Math.random()*ost.length)]; const nb={ostale:ost.filter(i=>i!==pick), zadnja:pick, n, ts:new Date().toISOString()}; S.bags[key]=nb;
  try{ localStorage.setItem('zv-bag-'+key, JSON.stringify(nb)); }catch(e){}

function onFoto(file){

function openCrop(img,url){
  const k=KID[fotoKid]; const V=Math.min(340, innerWidth-40, innerHeight-260);
  const min=V/Math.min(img.naturalWidth,img.naturalHeight);
  C={img,url,kid:fotoKid,V,min,s:min,x:(V-img.naturalWidth*min)/2,y:(V-img.naturalHeight*min)/2,ptr:new Map(),pinch:null};
  $('#crophost').innerHTML=`<div class="crop" role="dialog" aria-modal="true" aria-label="Namjesti sliku" style="--vp:${V}px;--kc:${k.kc}">
    <div class="ttl">Namjesti sliku – ${esc(k.ime)}<small>Povuci sliku, raširi prste ili koristi klizač za uvećanje</small></div>
    <div class="vp" id="vp"><img id="cropimg" src="${url}" alt=""><div class="grid"></div><div class="mask"></div></div>
    <div class="zoom"><button type="button" data-zoom="-1" aria-label="Umanji">−</button><input type="range" id="zoomr" min="1" max="5" step="0.01" value="1" aria-label="Uvećanje"><button type="button" data-zoom="1" aria-label="Uvećaj">+</button></div>
    <div class="acts"><button class="btn" data-crop="cancel">Odustani</button><button class="btn pri" data-crop="save">Spremi sliku</button></div>
  </div>`;

  const vp=$('#vp');

    else if(C.ptr.size===2 && C.pinch){ const n=pinchInfo(); const r=vp.getBoundingClientRect(); zoomAt(C.s*(n.d/C.pinch.d), n.cx-r.left, n.cy-r.top); C.x+=n.cx-C.pinch.cx; C.y+=n.cy-C.pinch.cy; C.pinch=n; drawCrop(); } });
  const up=e=>{ if(!C) return; C.ptr.delete(e.pointerId); C.pinch = C.ptr.size===2 ? pinchInfo() : null; if(!C.ptr.size) vp.classList.remove('drag'); };

  $('#zoomr').addEventListener('input',e=>{ zoomAt(C.min*Number(e.target.value), C.V/2, C.V/2); drawCrop(true); });

function pinchInfo(){ const [a,b]=[...C.ptr.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1, cx:(a.x+b.x)/2, cy:(a.y+b.y)/2}; }

function drawCrop(fromSlider){
  const w=C.img.naturalWidth*C.s, h=C.img.naturalHeight*C.s;
  C.x=Math.min(0,Math.max(C.V-w,C.x)); C.y=Math.min(0,Math.max(C.V-h,C.y));
  $('#cropimg').style.transform=`translate(${C.x}px,${C.y}px) scale(${C.s})`;
  if(!fromSlider){ const r=$('#zoomr'); if(r) r.value=String(C.s/C.min); }
}
function closeCrop(){ if(C) URL.revokeObjectURL(C.url); C=null; $('#crophost').innerHTML=''; fotoKid=null; $('#fotoinp').value=''; }
async function saveCrop(btn){
  if(!C) return; btn.disabled=true; btn.textContent='Spremam…';
  try{
    const OUT=480, c=document.createElement('canvas'); c.width=c.height=OUT;
    const sx=-C.x/C.s, sy=-C.y/C.s, sw=C.V/C.s;
    c.getContext('2d').drawImage(C.img,sx,sy,sw,sw,0,0,OUT,OUT);
    const blobF=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));
    const res=await S.assets.upload(blobF);
    await S.db.collection('postavke').doc('djeca').set({...S.foto,[C.kid]:res.id});
    toast('Slika postavljena'); closeCrop();
  }catch(e){ toast('Slika nije spremljena – pokušaj ponovno'); btn.disabled=false; btn.textContent='Spremi sliku'; }
}

function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload=()=>res(window.XLSX); sc.onerror=()=>rej(new Error('lib')); document.head.appendChild(sc); });
}
async function spremiKopiju(btn){
  if(!S.dl || !S.ready.z) return;

  try{
    const X = await loadXLSX();
    const d=new Date(), stamp=`${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}. u ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const wb = X.utils.book_new();
    const sum = [['KOPIJA (BACKUP) – aplikacija Zvjezdice'],['Ne upisuj ovdje – glavna evidencija je aplikacija.'],['Preuzeto:', stamp],[],
      ['Dijete','Velike dane','Male dane','Ukupno dano (€)','Duguje se','Dano unaprijed','Provjeri','Nejasno']];
    for(const k of KIDS){ const r=stats(ofKid(k.id)); sum.push([k.ime,r.V,r.M,r.eur,r.owe,r.adv,r.chk,r.unk]); }
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(sum), 'BACKUP');
    const hdr=['Datum','Šk. god.','Kategorija','Predmet / aktivnost','Opis','Ocjena','Zvjezdica','Boja','Broj','Dano?','Na ploči?','Datum davanja','U e-Dnevniku?','Datum provjere','e-Dnevnik status','€','Napomena'];
    for(const k of KIDS){
      const rows=[hdr, ...ofKid(k.id).slice().reverse().map(z=>[fmtD(z.datum), z.skGod||'', z.kategorija==='skola'?'Škola':z.kategorija==='kazna'?'Kazna (oduzeto)':z.kategorija==='kupnja'?`Kupnja (−${kupV(z)} vel., −${kupM(z)} mal.)`:'Ostalo', z.predmet||'', z.opis||'', z.ocjena??'', z.zvjezdica||'', (BOJE.find(x=>x[0]===z.boja)||['',''])[1], z.broj??'', z.dano||'', z.naPloci==='NE'?'čeka ploču':'na ploči', fmtD(z.datumDavanja), z.eDnevnik||'', fmtD(z.datumProvjere), z.kategorija==='skola'?EDT[status(z)]:'', z.dano==='DA'?vrijednost(z):0, z.napomena||''])];

      X.utils.book_append_sheet(wb, ws, k.ime);
    }
    const pv=[['Datum','Dijete','Nove (duguje se)','Potvrđeno','Napomena'], ...[...S.pv.values()].sort((a,b)=>(a.datum||'').localeCompare(b.datum||'')).map(p=>[fmtD(p.datum),(KID[p.dijete]||{}).ime||p.dijete||'',p.nove??'',p.potvrdjeno??'',p.napomena||''])];
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(pv), 'Provjere e-Dnevnika');
    const buf = X.write(wb,{bookType:'xlsx',type:'array'});
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    await S.dl.save({filename:`Zvjezdice - kopija ${ds}.xlsx`, data:buf});
    toast('Kopija spremljena');
  }catch(e){
    const c=e&&e.code;
    if(c==='declined') toast('Spremanje otkazano');
    else if(c==='rate_limited') toast('Pričekaj trenutak pa pokušaj ponovno');
    else if(e&&e.message==='lib') toast('Alat za Excel se nije učitao – provjeri internet');
    else { toast('Kopiju nije moguće spremiti u ovom prikazu'); if(['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){ btn.hidden=true; } }
  }finally{ btn.disabled=false; btn.textContent=old; }
}

  pl.classList.toggle('tvzoom', !!Z); tvZones().forEach(z=>z.classList.toggle('tvdimz', !!Z && z.dataset.zk!==k));
  if(!Z){ pl.style.transform=''; return; } const W=pl.offsetWidth, H=pl.offsetHeight, s=Math.min(W*.94/(Z.w*W), H*.86/(Z.h*H)), cx=(Z.x+Z.w/2)*W, cy=(Z.y+Z.h/2)*H;
  pl.style.transformOrigin='0 0'; pl.style.transform=`translate(${(W/2-cx*s).toFixed(1)}px,${(H/2-cy*s+H*.03).toFixed(1)}px) scale(${s.toFixed(3)})`; }
function tvZoom(k){ TVS.zoom = TVS.zoom===k ? null : k; tvZoomApply(); }
function tvWake(){ TVS.last=Date.now(); document.body.classList.remove('tvdim'); }
function tvClock(){ const c=document.getElementById('tvclock'); if(!c) return; const d=new Date(); c.textContent=d.toLocaleTimeString('hr-HR',{hour:'2-digit',minute:'2-digit'}); }
function tvMove(dir){ const zs=tvZones(); if(!zs.length) return; if(TVS.foc<0){ TVS.foc=0; return; }
  const c=z=>{ const r=z.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }, a=c(zs[TVS.foc]); let best=-1, bd=1e9;
  zs.forEach((z,i)=>{ if(i===TVS.foc) return; const b=c(z), dx=b.x-a.x, dy=b.y-a.y, along={ArrowRight:dx,ArrowLeft:-dx,ArrowDown:dy,ArrowUp:-dy}[dir], side={ArrowRight:dy,ArrowLeft:dy,ArrowDown:dx,ArrowUp:dx}[dir];
    if(along<=10) return; const d=along+Math.abs(side)*2; if(d<bd){ bd=d; best=i; } });
  if(best>=0) TVS.foc=best; }
// cijeli zaslon (bez trake preglednika); radi samo nakon tipke ili klika
const tvFsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
function tvFsOn(){ const d=document.documentElement, f=d.requestFullscreen||d.webkitRequestFullscreen; if(!f || tvFsEl()) return;
  try{ const r=f.call(d); if(r && r.catch) r.catch(()=>toast('Preglednik ne dopušta cijeli zaslon na ovoj stranici')); }catch(_){ toast('Preglednik ne dopušta cijeli zaslon na ovoj stranici'); } }
function tvFsOff(){ const f=document.exitFullscreen||document.webkitExitFullscreen; if(f && tvFsEl()) try{ const r=f.call(document); if(r&&r.catch) r.catch(()=>{}); }catch(_){} }
function tvFsBtn(){ let b=document.getElementById('tvfs'); if(!b){ document.body.insertAdjacentHTML('beforeend','<button type="button" id="tvfs" aria-label="Cijeli zaslon">⛶ Cijeli zaslon <small>OK</small></button>'); b=document.getElementById('tvfs'); b.addEventListener('click', e=>{ e.stopPropagation(); tvFsOn(); }); }
  b.hidden=!!tvFsEl(); }
function tvStart(){ document.body.classList.add('tv'); document.title='Zvjezdice · TV';
  document.addEventListener('keydown', e=>{ const back = e.keyCode===10009 || e.key==='GoBack' || e.key==='BrowserBack' || e.key==='Escape' || e.key==='Backspace';
    tvWake(); TVS.key=Date.now();
    if(/^Arrow/.test(e.key)){ e.preventDefault(); e.stopImmediatePropagation(); if(!TVS.zoom) tvMove(e.key); tvFocusApply(); return; }
    if(e.key==='Enter'){ e.preventDefault(); e.stopImmediatePropagation(); if(!tvFsEl() && (document.fullscreenEnabled||document.webkitFullscreenEnabled||document.documentElement.webkitRequestFullscreen)){ tvFsOn(); return; }   // prvi OK = cijeli zaslon
      if(TVS.foc<0) TVS.foc=0; const z=tvZones()[TVS.foc]; if(z) tvZoom(z.dataset.zk); tvFocusApply(); return; }
    if(back){ e.stopImmediatePropagation(); if(TVS.zoom){ e.preventDefault(); TVS.zoom=null; tvZoomApply(); } else if(tvFsEl()){ e.preventDefault(); tvFsOff(); } else if(e.key!=='Escape' && e.keyCode!==10009) e.preventDefault(); return; }   // Natrag nikad ništa ne briše
  }, true);
  // mišem: klik na ime djeteta = uvećaj / vrati; ništa se ne uređuje ni ne briše (zvjezdice se mogu premještati)
  document.addEventListener('click', e=>{ tvWake(); const t=e.target.closest && e.target.closest('[data-zedit],[data-ovclose],[data-swopen],[data-bzoom],[data-binfo],[data-bedit],[data-stanjeov],[data-ploca]'); if(!t) { if(TVS.zoom && !e.target.closest('.zona b')) { /* klik u uvećanje ne radi ništa */ } return; }
    e.preventDefault(); e.stopImmediatePropagation(); if(t.dataset.zedit){ const i=KIDS.findIndex(k=>k.id===t.dataset.zedit); TVS.foc=i; tvZoom(t.dataset.zedit); } }, true);
  ['pointermove','pointerdown','wheel'].forEach(ev=>document.addEventListener(ev, ()=>tvWake(), {passive:true, capture:true}));
  addEventListener('resize', ()=>{ tvScale(); tvFitLabels(); });
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev, ()=>{ tvFsBtn(); setTimeout(()=>{ tvScale(); tvFitLabels(); },120); }));
  // OLED: lagani pomak cijele ploče svakih 4 min, zatamnjenje nakon 10 min bez promjene i bez tipke
  setInterval(()=>{ const ov=document.querySelector('#ovhost .ov.board'); if(ov){ const a=Math.random()*Math.PI*2, r=4+Math.random()*8; ov.style.translate=`${(Math.cos(a)*r).toFixed(1)}px ${(Math.sin(a)*r).toFixed(1)}px`; } }, 240000);
  setInterval(()=>{ tvClock(); tvFocusApply(); if(Date.now()-TVS.last>600000) document.body.classList.add('tvdim'); }, 20000);
  // osigurač: svakih 45 min ponovno učitaj (ako se veza tiho prekinula), ali ne usred premještanja
  setInterval(()=>{ if(!(typeof DR!=='undefined' && DR)) location.reload(); }, 45*60000);
  try{ window.focus(); }catch(_){} }
if(TV) tvStart();
/* ===================== RODITELJSKI PIN: davanje, kazna, potrošnja, ispravci ploče, uređivanje zvjezdica i postavke =====================
   PIN se nikad ne sprema kao broj – samo PBKDF2 sažetak (sol + 120 000 ponavljanja). Nakon upisa vrijedi 10 min na tom uređaju. */
const PIN_SEL='[data-give],[data-kmode],[data-shop],[data-qgive],[data-xf="yes"],[data-bedit],[data-stanjeov],[data-swopen],[data-cmswap],[data-z],[data-new],[data-del],[data-kundo],#setbtn,[data-kcol],[data-palopen],[data-foto],[data-devtoggle]';
const PIN={doc:undefined, open:false, okMs:10*60000};
const pinOkUntil=()=>{ try{ return Number(localStorage.getItem('zv-pin-ok'))||0; }catch(_){ return PIN.mem||0; } };
const pinUnlocked=()=>pinOkUntil()>Date.now();
function pinSetOk(on){ const v=on?Date.now()+PIN.okMs:0; PIN.mem=v; try{ localStorage.setItem('zv-pin-ok', String(v)); }catch(_){} pinBtn(); }
async function pinHash(pin, salt, it=120000){ const enc=new TextEncoder(), key=await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:enc.encode(salt), iterations:it}, key, 256); return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function pinLoad(){ if(PIN.doc!==undefined) return PIN.doc; try{ const d=await S.realDb.collection('postavke').doc('roditelj').get(); PIN.doc = d&&d.exists ? d.data() : null; }catch(_){ PIN.doc=null; } return PIN.doc; }
// zaključavanje nakon 5 krivih pokušaja: 60 s
const pinLockLeft=()=>{ let u=0; try{ u=Number(localStorage.getItem('zv-pin-lock'))||0; }catch(_){} return Math.max(0,u-Date.now()); };
function pinPad({naslov, opis, onDone, onCancel}){ PIN.open=true; let val='';
  const ov=document.createElement('div'); ov.className='pinov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.innerHTML=`<div class="pincard"><div class="pinlock">🔒</div><h3>${naslov}</h3><p class="pinopis">${opis||''}</p><div class="pindots">${'<i></i>'.repeat(6)}</div><p class="pinmsg" aria-live="polite"></p>
    <div class="pinkeys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-pk="${n}">${n}</button>`).join('')}<button type="button" data-pk="c" class="pinfn">Odustani</button><button type="button" data-pk="0">0</button><button type="button" data-pk="b" class="pinfn" aria-label="Obriši">⌫</button></div>
    <button type="button" class="btn gold pinok" data-pk="ok">Potvrdi</button></div>`;
  document.body.appendChild(ov); const dots=[...ov.querySelectorAll('.pindots i')], msg=ov.querySelector('.pinmsg'), card=ov.querySelector('.pincard');
  const draw=()=>dots.forEach((d,i)=>d.classList.toggle('on', i<val.length));
  const close=()=>{ PIN.open=false; ov.remove(); document.removeEventListener('keydown', kd, true); };
  const fail=t=>{ msg.textContent=t; val=''; draw(); if(!RM()) card.animate([{transform:'translateX(0)'},{transform:'translateX(-14px)'},{transform:'translateX(12px)'},{transform:'translateX(-8px)'},{transform:'translateX(0)'}],{duration:380}); };
  const api={ fail, msg:t=>{ msg.textContent=t; }, reset:()=>{ val=''; draw(); }, close };
  const press=async k=>{ const lock=pinLockLeft(); if(lock && k!=='c'){ msg.textContent=`Previše pokušaja – pričekaj ${Math.ceil(lock/1000)} s`; return; }
    if(k==='c'){ close(); onCancel&&onCancel(); return; } if(k==='b'){ val=val.slice(0,-1); draw(); return; }
    if(k==='ok'){ if(val.length<4){ fail('PIN ima 4 do 6 znamenki'); return; } const v=val; msg.textContent='…'; await onDone(v, api); return; }
    if(val.length<6){ val+=k; draw(); msg.textContent=''; sndAt('tick', performance.now(), .25, card); } };
  ov.addEventListener('click', e=>{ const b=e.target.closest('[data-pk]'); if(b){ e.stopPropagation(); press(b.dataset.pk); } else if(e.target===ov){ close(); onCancel&&onCancel(); } });
  const kd=e=>{ if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('b'); else if(e.key==='Enter') press('ok'); else if(e.key==='Escape') press('c'); else return; e.preventDefault(); e.stopImmediatePropagation(); };
  document.addEventListener('keydown', kd, true); draw(); setTimeout(()=>{ const b=ov.querySelector('[data-pk="1"]'); b&&b.focus({preventScroll:true}); },30); return api; }
async function pinAsk(onOk){ if(PIN.open) return; const d=await pinLoad();
  if(!d){ // prvi put: postavljanje PIN-a (dvaput)
    let first=null; pinPad({naslov:'Postavi roditeljski PIN', opis:'Samo ti ćeš moći davati zvjezdice i mijenjati stanje. Upiši 4–6 znamenki.', onDone:async(v,api)=>{
      if(!first){ first=v; api.reset(); api.msg('Upiši isti PIN još jednom'); return; } if(v!==first){ first=null; api.fail('Nisu isti – kreni ispočetka'); return; }
      const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join(''), doc={salt, hash:await pinHash(v,salt), it:120000, ts:new Date().toISOString()};
      try{ await S.realDb.collection('postavke').doc('roditelj').set(doc); PIN.doc=doc; }catch(_){ api.fail('PIN nije spremljen – pokušaj ponovno'); return; }
      api.close(); pinSetOk(true); toast('🔒 Roditeljski PIN je postavljen'); onOk&&onOk(); } }); return; }
  pinPad({naslov:'Roditeljski PIN', opis:'Ovo može samo roditelj. (Demo PIN: 1234)', onDone:async(v,api)=>{
    const h=await pinHash(v, d.salt, d.it||120000);
    if(h===d.hash){ try{ localStorage.removeItem('zv-pin-bad'); }catch(_){} api.close(); pinSetOk(true); sndAt('chime', performance.now(), .4); onOk&&onOk(); return; }
    let n=0; try{ n=(Number(localStorage.getItem('zv-pin-bad'))||0)+1; localStorage.setItem('zv-pin-bad', String(n)); if(n>=5){ localStorage.setItem('zv-pin-lock', String(Date.now()+60000)); localStorage.setItem('zv-pin-bad','0'); } }catch(_){}
    api.fail(n>=5 ? 'Previše pokušaja – zaključano 60 s' : `Krivi PIN (${n}/5)`); } }); }
async function pinChange(){ const d=await pinLoad(); if(!d){ pinAsk(); return; } pinAsk(()=>{ PIN.doc=null; pinAsk(()=>toast('🔒 Novi PIN je spremljen')); }); }
// presretanje: zaštićeni klik bez otključavanja → PIN, pa se isti klik ponovi
window.addEventListener('click', e=>{ if(TV || !S.realDb) return; const t=e.target.closest && e.target.closest(PIN_SEL); if(!t || t.closest('.pinov') || pinUnlocked()) return;
  if(t.matches('[data-z]') && t.closest('.zvdemo')) return; e.preventDefault(); e.stopImmediatePropagation(); pinAsk(()=>{ if(t.isConnected) t.click(); }); }, true);
// mala brava u zaglavlju dok je otključano: klik = zaključaj odmah (ili promijeni PIN)
function pinBtn(){ let b=document.getElementById('pinbtn'); const on=pinUnlocked(); if(!b){ const h=document.getElementById('setbtn'); if(!h) return; h.insertAdjacentHTML('beforebegin','<button class="iconbtn" id="pinbtn" hidden title="Otključano – klikni za zaključavanje" aria-label="Zaključaj">🔓</button>'); b=document.getElementById('pinbtn');
    b.addEventListener('click', e=>{ e.stopPropagation(); if(e.altKey||e.shiftKey){ pinChange(); return; } pinSetOk(false); toast('🔒 Zaključano'); }); }
  b.hidden=!on; if(on){ const m=Math.max(1,Math.ceil((pinOkUntil()-Date.now())/60000)); b.title=`Otključano još ${m} min – klikni za zaključavanje (Shift+klik: promijeni PIN)`; } }
setInterval(pinBtn, 30000);
pinBtn();
fromHash(); boot();
})();
